[project]
name = "mcp-pystub"
version = "0.3.0"
description = "Python exe ビルド時にスタブ置換可能なパッケージを自動検出する MCP サーバー。C拡張パッケージの間接排除にも対応 / Auto-detect stubbable packages for Python exe builds, including indirect elimination of C-extension packages"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "KoyoYeager" },
]
keywords = ["mcp", "python", "exe", "pyinstaller", "nuitka", "stub", "optimization", "ast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0,<2",  # mcp 2.x は FastMCP の名前と API が変わった
]

[project.urls]
Homepage = "https://github.com/KoyoYeager/mcp-pystub"
Repository = "https://github.com/KoyoYeager/mcp-pystub"
Issues = "https://github.com/KoyoYeager/mcp-pystub/issues"

[project.scripts]
mcp-pystub = "mcp_pystub.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_pystub"]

[tool.hatch.build.targets.sdist]
# テスト用の空の拡張モジュール（.pyd / .so）は既定で落ちるので明示する（test_submodule_stubs が使う）
artifacts = [
    "/tests/fixtures/**/*.pyd",
    "/tests/fixtures/**/*.so",
]
include = [
    "/mcp_pystub",
    "/tests",
    "/README.md",
    "/README.ja.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
    "/server.json",
]
exclude = [
    "/.claude",
    "/_check*",
    "/_repro",
    "/tests/attacks/runs",
    "**/__pycache__",
    "**/*.pyc",
    ".pytest_cache",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
